<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>福岡家族之旅 - memo</title>
  <link rel="stylesheet" href="style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

  <header>
    <h1>福岡家族之旅 🇯🇵</h1>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-title">shopping 小筆記</div>
      <p class="memo-hint">內容只會儲存在你的手機</p>
      <label class="memo-label" for="travel-memo">哩哩摳摳</label>
      <textarea id="travel-memo" class="memo-textarea" rows="9" placeholder="Anything u want!" oninput="saveMemo()"></textarea>
    </div>


    <div class="card">
      <div class="card-title">備忘錄</div>
      <p class="memo-hint">內容只會儲存在你的手機</p>
      <label class="memo-label" for="travel-memo">備忘內容</label>
      <textarea id="travel-memo" class="memo-textarea" rows="9" placeholder="Anything u need!" oninput="saveMemo()"></textarea>
    </div>
  </main>

  <!-- 底部選單 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>首頁</span></a>
    <a href="itinerary.html" class="nav-item"><span class="icon">📅</span><span>行程</span></a>
    <a href="checklist.html" class="nav-item active"><span class="icon">📝</span><span>memo</span></a>
    <a href="locations.html" class="nav-item"><span class="icon">📍</span><span>購物指南</span></a>

  </nav>

  <script>
    function toggleCheck(checkbox) {
      const item = checkbox.parentElement;
      if (checkbox.checked) { item.classList.add('done'); } 
      else { item.classList.remove('done'); }
      saveChecklist();
    }

    function saveChecklist() {
      const states = [];
      document.querySelectorAll('.check-item input').forEach((cb) => { states.push(cb.checked); });
      localStorage.setItem('fukuoka_checklist', JSON.stringify(states));
    }

    function loadChecklist() {
      const saved = JSON.parse(localStorage.getItem('fukuoka_checklist') || '[]');
      document.querySelectorAll('.check-item input').forEach((cb, i) => {
        if (saved[i]) {
          cb.checked = true;
          cb.parentElement.classList.add('done');
        }
      });
    }

    function saveMemo() {
      const memo = document.getElementById('travel-memo').value;
      localStorage.setItem('fukuoka_personal_memo', memo);
      const status = document.getElementById('memo-status');
      status.textContent = '✓ 已自動儲存';
      clearTimeout(saveMemo.statusTimer);
      saveMemo.statusTimer = setTimeout(() => {
        status.textContent = '已儲存在本機';
      }, 1500);
    }

    function loadMemo() {
      document.getElementById('travel-memo').value = localStorage.getItem('fukuoka_personal_memo') || '';
    }

    loadChecklist();
    loadMemo();
  </script>
</body>
</html>
