    function renderLocations() {
      const list = document.getElementById('location-list');
      list.innerHTML = LOCATION_GROUPS.map(group => `
        <section class="location-group">
          <h2 class="location-group-title">${group.title}</h2>
          ${group.image ? `
            <button class="location-group-image-link" type="button" onclick="openImage(this.querySelector('img'))">
              <img class="location-group-image" src="${group.image}" alt="${group.imageAlt || group.title}" loading="lazy">
              <span>🔍 ${group.imageLabel || '查看圖片'}</span>
            </button>` : ''}
          ${group.locations.map(location => {
            const mapUrl = typeof MAP_LINKS !== 'undefined' ? MAP_LINKS[location.key] : '';
            return `
              <details class="location-card">
                <summary>
                  <span class="location-icon">${location.icon}</span>
                  <span class="location-heading">
                    <span class="location-name">${location.name}</span>
                    <span class="location-tips">${location.tips}</span>
                  </span>
                  <span class="location-chevron">›</span>
                </summary>
                <div class="location-details">
                  <p>${location.description}</p>
                  ${(location.extras || []).map(extra => `
                    <div class="location-extra">
                      ${extra.title ? (extra.link && !extra.linkLabel
                        ? `<a class="location-extra-title location-extra-title-link" href="${extra.link}" target="_blank" rel="noopener noreferrer">${extra.title}</a>`
                        : `<div class="location-extra-title">${extra.title}</div>`) : ''}
                      ${extra.text ? `<div class="location-extra-text">${extra.text}</div>` : ''}
                      ${extra.image ? `<img class="location-extra-image" src="${extra.image}" alt="${extra.imageAlt || extra.title}" loading="lazy" onclick="openImage(this)" title="點擊放大">` : ''}
                      ${extra.table ? `
                        <div class="location-table-wrap">
                          <table class="location-table">
                            <thead><tr>${extra.table.headers.map(header => `<th>${header}</th>`).join('')}</tr></thead>
                            <tbody>${extra.table.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody>
                          </table>
                        </div>` : ''}
                      ${extra.link && (extra.linkLabel || !extra.title) ? `<a class="location-extra-link" href="${extra.link}" target="_blank" rel="noopener noreferrer">${extra.linkLabel || '查看相關資訊'}</a>` : ''}
                      ${(extra.links || []).map(item => `
                        <div class="location-extra-link-item">
                          <a class="location-extra-link" href="${item.url}" target="_blank" rel="noopener noreferrer">${item.label || '查看相關資訊'}</a>
                          ${item.text ? `<small class="location-extra-link-text">${item.text}</small>` : ''}
                        </div>`).join('')}
                    </div>`).join('')}
                  ${mapUrl ? `<a class="location-map-link" href="${mapUrl}" target="_blank" rel="noopener noreferrer">📍 開啟導航</a>` : ''}
                </div>
              </details>`;
          }).join('')}
        </section>`).join('');
    }

    function renderBookingDocuments() {
      const list = document.getElementById('booking-list');
      if (BOOKING_DOCUMENTS.length === 0) {
        list.innerHTML = '<div class="booking-empty">尚未加入預訂資料</div>';
        return;
      }

      list.innerHTML = BOOKING_DOCUMENTS.map(item => `
        <article class="booking-card">
          <div class="booking-card-title">${item.title}</div>
          ${item.text ? `<div class="booking-card-text">${item.text}</div>` : ''}
          ${item.image ? `<img class="booking-image" src="${item.image}" alt="${item.imageAlt || item.title}" loading="lazy" onclick="openImage(this)" title="點擊放大">` : ''}
          ${item.file ? `<a class="booking-file-link" href="${item.file}" target="_blank" rel="noopener noreferrer">${item.fileLabel || '📄 開啟檔案'}</a>` : ''}
          ${item.url ? `<a class="booking-file-link" href="${item.url}" target="_blank" rel="noopener noreferrer">${item.urlLabel || '🔗 開啟相關網頁'}</a>` : ''}
        </article>`).join('');
    }

    function openImage(image) {
      const lightbox = document.getElementById('image-lightbox');
      const enlargedImage = document.getElementById('image-lightbox-content');
      enlargedImage.src = image.src;
      enlargedImage.alt = image.alt;
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeImage(event) {
      if (event && event.target.id !== 'image-lightbox') return;
      const lightbox = document.getElementById('image-lightbox');
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeImage();
    });

    renderLocations();
    renderBookingDocuments();
